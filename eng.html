<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>A1 Engine</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0C0E12">
  <meta name="format-detection" content="telephone=no">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='28' fill='%23141821'/><path d='M30 65L50 25L70 65M38 52H62' stroke='%234F8EF7' stroke-width='9' stroke-linecap='round' stroke-linejoin='round'/></svg>">
  <style>
    :root {
      --bg: #0C0E12;
      --surface: #141821;
      --surface-elevated: #1B212D;
      --surface-inset: #090B0E;
      --border: rgba(255, 255, 255, 0.08);
      --border-focus: rgba(79, 142, 247, 0.4);
      --accent: #4F8EF7;
      --accent-soft: rgba(79, 142, 247, 0.12);
      --accent-glow: rgba(79, 142, 247, 0.25);
      --text-primary: #F0F3F7;
      --text-secondary: #8B94A4;
      --text-muted: #525B6C;
      --danger: #FF6B6B;
      --danger-bg: rgba(255, 107, 107, 0.1);
      --danger-border: rgba(255, 107, 107, 0.25);
      --radius-outer: 22px;
      --radius-inner: 14px;
      --safe-top: env(safe-area-inset-top, 16px);
      --safe-bottom: env(safe-area-inset-bottom, 16px);
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }
    html, body {
      background-color: var(--bg);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      min-height: -webkit-fill-available;
      overflow-x: hidden;
      touch-action: manipulation;
      -webkit-font-smoothing: antialiased;
    }
    body {
      display: flex;
      justify-content: center;
      align-items: stretch;
    }
    .app-frame {
      width: 100%;
      max-width: 440px;
      min-height: 100vh;
      min-height: -webkit-fill-available;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: calc(var(--safe-top) + 12px) 18px calc(var(--safe-bottom) + 12px) 18px;
    }
    header {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .nav-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .topic-badge {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 7px 14px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-primary);
      letter-spacing: -0.2px;
    }
    .topic-badge select {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      cursor: pointer;
    }
    .counter-pill {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-secondary);
      font-variant-numeric: tabular-nums;
      background: var(--surface-inset);
      padding: 5px 12px;
      border-radius: 999px;
      border: 1px solid var(--border);
    }
    .progress-track {
      width: 100%;
      height: 4px;
      background: var(--surface-inset);
      border-radius: 999px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      width: 100%;
      background: var(--accent);
      border-radius: 999px;
      transform-origin: left center;
      transform: scaleX(0);
      will-change: transform;
      transition: transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    .card-workspace {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      margin: 14px 0;
      contain: layout paint style;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-outer);
      padding: 22px 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 410px;
      cursor: pointer;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
      position: relative;
    }
    .card:active {
      border-color: var(--border-focus);
    }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .meta-tag {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      color: var(--accent);
      background: var(--accent-soft);
      padding: 4px 10px;
      border-radius: 6px;
    }
    .audio-trigger {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--surface-elevated);
      border: 1px solid var(--border);
      color: var(--text-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      touch-action: manipulation;
    }
    .audio-trigger:active {
      background: var(--border-focus);
      transform: scale(0.94);
    }
    .audio-trigger svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }
    .card-core {
      text-align: center;
      margin: auto 0;
      padding: 6px 0;
    }
    .word-en {
      font-size: 34px;
      font-weight: 700;
      letter-spacing: -0.6px;
      color: var(--text-primary);
      line-height: 1.15;
    }
    .word-tr {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 15px;
      color: var(--text-muted);
      margin-top: 6px;
    }
    .reveal-area {
      margin-top: 18px;
      padding-top: 16px;
      border-top: 1px dashed var(--border);
      display: none;
    }
    .reveal-area.is-open {
      display: block;
    }
    .word-ru {
      font-size: 22px;
      font-weight: 600;
      color: var(--accent);
      margin-bottom: 12px;
      line-height: 1.25;
    }
    .context-block {
      background: var(--surface-inset);
      border-radius: var(--radius-inner);
      padding: 12px 14px;
      text-align: left;
      border-left: 3px solid var(--accent);
      position: relative;
    }
    .context-en {
      font-size: 15px;
      font-weight: 500;
      color: var(--text-primary);
      line-height: 1.4;
      padding-right: 32px;
    }
    .context-ru {
      font-size: 13px;
      color: var(--text-secondary);
      margin-top: 4px;
      line-height: 1.35;
    }
    .speak-phrase-icon {
      position: absolute;
      right: 8px;
      top: 10px;
      width: 32px;
      height: 32px;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
    }
    .speak-phrase-icon:active {
      color: var(--accent);
      background: var(--surface-elevated);
    }
    .speak-phrase-icon svg {
      width: 17px;
      height: 17px;
      fill: currentColor;
    }
    .hint-footer {
      text-align: center;
      font-size: 12px;
      color: var(--text-muted);
      letter-spacing: 0.1px;
    }
    .action-panel {
      display: grid;
      grid-template-columns: 1fr 1.3fr;
      gap: 12px;
    }
    .action-btn {
      appearance: none;
      border: none;
      outline: none;
      min-height: 62px;
      border-radius: 16px;
      font-size: 16px;
      font-weight: 600;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 6px;
      touch-action: manipulation;
    }
    .action-btn:active {
      transform: scale(0.98);
    }
    .action-sub {
      font-size: 11px;
      font-weight: 400;
      opacity: 0.75;
      margin-top: 2px;
    }
    .btn-repeat {
      background: var(--danger-bg);
      border: 1px solid var(--danger-border);
      color: var(--danger);
    }
    .btn-mastered {
      background: var(--accent);
      color: #FFFFFF;
      box-shadow: 0 4px 16px var(--accent-glow);
    }
    .finish-state {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-outer);
      padding: 36px 20px;
      min-height: 410px;
    }
    .finish-state h2 {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .finish-state p {
      font-size: 14px;
      color: var(--text-secondary);
      line-height: 1.5;
      margin-bottom: 24px;
      max-width: 280px;
    }
    .btn-reset-topic {
      background: var(--surface-elevated);
      border: 1px solid var(--border);
      color: var(--text-primary);
      padding: 14px 24px;
      border-radius: var(--radius-inner);
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>
<div class="app-frame">
  <header>
    <div class="nav-bar">
      <div class="topic-badge">
        <span id="topicTitle">Все разделы</span>
        <select id="topicDropdown">
          <option value="ALL">Все темы (60)</option>
          <option value="IT_CODE">Код и Техподдержка (15)</option>
          <option value="CNC_ENG">ЧПУ и Производство (15)</option>
          <option value="HOUSING">Жильё и Аренда (15)</option>
          <option value="SURVIVAL">Город и Выживание (15)</option>
        </select>
      </div>
      <div class="counter-pill" id="counterPill">0 / 60</div>
    </div>
    <div class="progress-track">
      <div class="progress-fill" id="progressFill"></div>
    </div>
  </header>

  <main class="card-workspace" id="cardWorkspace">
    <div class="card" id="activeCard">
      <div class="card-header">
        <span class="meta-tag" id="categoryBadge">Категория</span>
        <button class="audio-trigger" id="audioTrigger" title="Прослушать слово">
          <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
        </button>
      </div>
      <div class="card-core">
        <div class="word-en" id="wordEn">...</div>
        <div class="word-tr" id="wordTr">[ ... ]</div>
        <div class="reveal-area" id="revealArea">
          <div class="word-ru" id="wordRu">...</div>
          <div class="context-block">
            <div class="context-en" id="contextEn">...</div>
            <div class="context-ru" id="contextRu">...</div>
            <div class="speak-phrase-icon" id="speakPhraseTrigger" title="Озвучить фразу">
              <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
            </div>
          </div>
        </div>
      </div>
      <div class="hint-footer" id="hintFooter">Нажми, чтобы увидеть перевод и фразу</div>
    </div>
  </main>

  <div class="finish-state" id="finishState">
    <h2>Слова закреплены</h2>
    <p>В этом блоке не осталось активных карточек. Отличная работа без давления и спешки.</p>
    <button class="btn-reset-topic" id="btnResetTopic">Повторить этот раздел заново</button>
  </div>

  <footer class="action-panel" id="actionPanel">
    <button class="action-btn btn-repeat" id="btnRepeat">
      <span>Повторить</span>
      <span class="action-sub">в конец очереди</span>
    </button>
    <button class="action-btn btn-mastered" id="btnMastered">
      <span>Запомнил</span>
      <span class="action-sub">знаю точно</span>
    </button>
  </footer>
</div>

const CAT_TITLES = {
  "IT_CODE": "Код и Саппорт",
  "CNC_ENG": "ЧПУ и Инженерия",
  "HOUSING": "Жильё и Быт",
  "SURVIVAL": "База и Город"
};

const PERSISTENCE_KEY = "a1_fasttrack_mastered_ids_v4";

class A1LearningEngine {
  constructor() {
    this.mastered = new Set(this.readStorage());
    this.activeTopic = "ALL";
    this.sessionQueue = [];
    this.activeItem = null;
    this.isRevealed = false;
    this.speechAvailable = "speechSynthesis" in window;
    this.activeUtterance = null;
    this.speechVoices = [];

    this.cacheElements();
    this.initSpeechEngine();
    this.bindInteractions();
    this.refreshQueue();
  }

  readStorage() {
    try {
      const raw = localStorage.getItem(PERSISTENCE_KEY);
      return raw ? JSON.parse(raw) : [];
    } catch (err) {
      return [];
    }
  }

  writeStorage() {
    try {
      localStorage.setItem(PERSISTENCE_KEY, JSON.stringify([...this.mastered]));
    } catch (err) {}
  }

  cacheElements() {
    this.topicTitle = document.getElementById("topicTitle");
    this.topicDropdown = document.getElementById("topicDropdown");
    this.counterPill = document.getElementById("counterPill");
    this.progressFill = document.getElementById("progressFill");
    this.cardWorkspace = document.getElementById("cardWorkspace");
    this.activeCard = document.getElementById("activeCard");
    this.categoryBadge = document.getElementById("categoryBadge");
    this.audioTrigger = document.getElementById("audioTrigger");
    this.wordEn = document.getElementById("wordEn");
    this.wordTr = document.getElementById("wordTr");
    this.revealArea = document.getElementById("revealArea");
    this.wordRu = document.getElementById("wordRu");
    this.contextEn = document.getElementById("contextEn");
    this.contextRu = document.getElementById("contextRu");
    this.speakPhraseTrigger = document.getElementById("speakPhraseTrigger");
    this.hintFooter = document.getElementById("hintFooter");
    this.actionPanel = document.getElementById("actionPanel");
    this.btnRepeat = document.getElementById("btnRepeat");
    this.btnMastered = document.getElementById("btnMastered");
    this.finishState = document.getElementById("finishState");
    this.btnResetTopic = document.getElementById("btnResetTopic");
  }

  initSpeechEngine() {
    if (!this.speechAvailable) return;
    const loadVoices = () => {
      this.speechVoices = window.speechSynthesis.getVoices().filter(v => v.lang.startsWith("en"));
    };
    loadVoices();
    if (window.speechSynthesis.onvoiceschanged !== undefined) {
      window.speechSynthesis.onvoiceschanged = loadVoices;
    }
  }

  bindInteractions() {
    this.activeCard.addEventListener("click", (e) => {
      if (e.target.closest("#audioTrigger") || e.target.closest("#speakPhraseTrigger")) return;
      this.toggleDetails();
    });

    this.audioTrigger.addEventListener("click", (e) => {
      e.stopPropagation();
      if (this.activeItem) this.speak(this.activeItem.en, 0.82);
    });

    this.speakPhraseTrigger.addEventListener("click", (e) => {
      e.stopPropagation();
      if (this.activeItem) this.speak(this.activeItem.exEn, 0.88);
    });

    this.btnRepeat.addEventListener("click", () => this.recordResponse(false));
    this.btnMastered.addEventListener("click", () => this.recordResponse(true));

    this.topicDropdown.addEventListener("change", (e) => {
      this.activeTopic = e.target.value;
      const text = e.target.options[e.target.selectedIndex].text.split(" (")[0];
      this.topicTitle.textContent = text;
      this.refreshQueue();
    });

    this.btnResetTopic.addEventListener("click", () => {
      const activePool = this.getTopicDataset();
      activePool.forEach(item => this.mastered.delete(item.id));
      this.writeStorage();
      this.refreshQueue();
    });
  }

  getTopicDataset() {
    return this.activeTopic === "ALL"
      ? VOCABULARY
      : VOCABULARY.filter(item => item.cat === this.activeTopic);
  }

  refreshQueue() {
    const dataset = this.getTopicDataset();
    this.sessionQueue = dataset.filter(item => !this.mastered.has(item.id));
    this.updateProgressIndicator();
    this.displayNext();
  }

  toggleDetails() {
    this.isRevealed = !this.isRevealed;
    if (this.isRevealed) {
      this.revealArea.classList.add("is-open");
      this.hintFooter.textContent = "Оцени знание: повторить или запомнил";
    } else {
      this.revealArea.classList.remove("is-open");
      this.hintFooter.textContent = "Нажми, чтобы увидеть перевод и фразу";
    }
  }

  displayNext() {
    this.isRevealed = false;
    this.revealArea.classList.remove("is-open");
    this.hintFooter.textContent = "Нажми, чтобы увидеть перевод и фразу";

    if (this.sessionQueue.length === 0) {
      this.cardWorkspace.style.display = "none";
      this.actionPanel.style.display = "none";
      this.finishState.style.display = "flex";
      return;
    }

    this.cardWorkspace.style.display = "flex";
    this.actionPanel.style.display = "grid";
    this.finishState.style.display = "none";

    this.activeItem = this.sessionQueue[0];
    this.categoryBadge.textContent = CAT_TITLES[this.activeItem.cat] || "A1";
    this.wordEn.textContent = this.activeItem.en;
    this.wordTr.textContent = this.activeItem.tr;
    this.wordRu.textContent = this.activeItem.ru;
    this.contextEn.textContent = this.activeItem.exEn;
    this.contextRu.textContent = this.activeItem.exRu;
  }

  recordResponse(isMastered) {
    if (!this.activeItem) return;

    if (isMastered) {
      this.mastered.add(this.activeItem.id);
      this.writeStorage();
      this.sessionQueue.shift();
    } else {
      const current = this.sessionQueue.shift();
      this.sessionQueue.push(current);
    }

    this.updateProgressIndicator();
    this.displayNext();
  }

  updateProgressIndicator() {
    const dataset = this.getTopicDataset();
    const total = dataset.length;
    const learnedInTopic = dataset.filter(i => this.mastered.has(i.id)).length;
    const ratio = total > 0 ? (learnedInTopic / total) : 0;

    this.counterPill.textContent = `${learnedInTopic} / ${total}`;
    this.progressFill.style.transform = `scaleX(${ratio})`;
  }

  speak(text, rate) {
    if (!this.speechAvailable || !text) return;

    try {
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = "en-US";
      utterance.rate = rate || 0.85;
      utterance.pitch = 1.0;

      if (this.speechVoices.length > 0) {
        const preferred = this.speechVoices.find(v => v.lang === "en-US") || this.speechVoices[0];
        if (preferred) utterance.voice = preferred;
      }

      this.activeUtterance = utterance;
      utterance.onend = () => { this.activeUtterance = null; };
      utterance.onerror = () => { this.activeUtterance = null; };

      window.speechSynthesis.speak(utterance);
    } catch (err) {}
  }
}

if (document.readyState === "loading") {
  document.addEventListener("DOMContentLoaded", () => new A1LearningEngine());
} else {
  new A1LearningEngine();
}
</script>
